version: '3'

vars:
  APP_NAME: "elyro"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

# Wails hard-codes -mmacosx-version-min=10.13 in its cgo flags; Go 1.27 needs macOS 13.
# Set once here so every task that compiles cgo (build, test, dev) links for 13.0.
# Keep LSMinimumSystemVersion in build/darwin/Info*.plist in step.
env:
  CGO_CFLAGS: "-mmacosx-version-min=13.0"
  CGO_LDFLAGS: "-mmacosx-version-min=13.0"
  MACOSX_DEPLOYMENT_TARGET: "13.0"

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  test:
    summary: Runs Go tests (main.go embeds frontend/dist, so the frontend is built first)
    deps: [common:build:frontend]
    cmds:
      - go test ./...

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
